<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, maximum-scale=0.8, user-scalable=no, viewport-fit=cover">
    <title>我的新家 - 装修管理</title>
    <link rel="shortcut icon" href="//ai-1303208826.cos.ap-guangzhou.myqcloud.com/WorkbenchApp/sklogo3_n.png">
    <meta name="theme-color" content="#ffffff">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sass.js/0.11.1/sass.sync.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script type="module" src="/app/js/app.js"></script>
    <link rel="stylesheet" href="/app/css/style.css">
</head>
<body>
    <div id="app" v-cloak class="app-root">
        
        <!-- Navigation Header (Dynamic & Minimal) -->
        <header class="app-header" 
                :class="[state.currentView === 'home' ? (state.scrolled ? 'header-scrolled' : 'header-transparent text-white') : 'header-transparent']">
            <div class="header-left">
                <button v-if="state.currentView !== 'home'" @click="actions.goBack" class="icon-btn">
                    <i data-lucide="arrow-left" :class="state.currentView === 'home' && !state.scrolled ? 'text-white' : 'text-black'"></i>
                </button>
            </div>
            
            <h1 class="header-title opacity-100">
                {{ viewTitle }}
            </h1>
            
            <div class="header-right">
                <button v-if="['expenses', 'concepts', 'purchase-plans'].includes(state.currentView)" @click="actions.navigate(state.currentView === 'expenses' ? 'expense-form' : state.currentView === 'concepts' ? 'concept-form' : 'purchase-plan-form', { mode: 'add' })" class="icon-btn">
                    <i data-lucide="plus" class="text-black"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area with View Transitions -->
        <main class="app-main">
            <transition :name="state.transitionName">
                <component :is="currentViewComponent"></component>
            </transition>
        </main>

        <!-- Image Preview Modal -->
        <transition name="fade">
            <div v-if="state.previewModal.show" class="preview-modal-overlay" @click="actions.closePreviewModal">
                <button class="preview-close-btn" @click.stop="actions.closePreviewModal">
                    <i data-lucide="x" class="text-white"></i>
                </button>
                <img :src="state.previewModal.imageUrl" class="preview-modal-image" @click.stop />
            </div>
        </transition>

        <!-- Minimal FAB Action Menu -->
        <div v-show="state.currentView === 'home'" class="fab-container">
            
            <!-- Backdrop (Invisible, just for clicking outside) -->
            <transition name="fade">
                <div v-if="state.fabOpen" @click="state.fabOpen = false" class="fab-backdrop"></div>
            </transition>

            <!-- Menu Items -->
            <div class="fab-menu">
                <transition name="slide-up-fade">
                    <div v-if="state.fabOpen" class="fab-item fab-item-1">
                        <!-- Add Concept -->
                        <button @click="actions.navigate('concept-form', { mode: 'add' }); state.fabOpen = false" class="fab-sub-btn group">
                            <span class="fab-sub-btn-text">灵感</span>
                        </button>
                    </div>
                </transition>
                
                <transition name="slide-up-fade">
                    <div v-if="state.fabOpen" class="fab-item fab-item-2" style="transition-delay: 50ms;">
                        <!-- Add Purchase Plan -->
                        <button @click="actions.navigate('purchase-plan-form', { mode: 'add' }); state.fabOpen = false" class="fab-sub-btn group">
                            <span class="fab-sub-btn-text">清单</span>
                        </button>
                    </div>
                </transition>
                
                <transition name="slide-up-fade">
                    <div v-if="state.fabOpen" class="fab-item fab-item-3" style="transition-delay: 100ms;">
                        <!-- Add Expense -->
                        <button @click="actions.navigate('expense-form', { mode: 'add' }); state.fabOpen = false" class="fab-sub-btn group">
                            <span class="fab-sub-btn-text">记账</span>
                        </button>
                    </div>
                </transition>
                
                <!-- <transition name="slide-up-fade">
                    <div v-if="state.fabOpen" class="fab-item fab-item-3" style="transition-delay: 100ms;">
                     
                        <button @click="actions.navigate('assistant'); state.fabOpen = false" class="fab-sub-btn group">
                            <span class="fab-sub-btn-text">AI</span>
                        </button>
                    </div>
                </transition> -->
            </div>

            <!-- Main FAB Button -->
            <button @click="state.fabOpen = !state.fabOpen" class="fab-main-btn" :class="state.fabOpen ? 'fab-main-open' : 'fab-main-closed'">
                <i data-lucide="plus"></i>
            </button>
        </div>
    </div>
</body>
</html>
