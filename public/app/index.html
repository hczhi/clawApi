<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>我的新家 - 装修管理</title>
    <link rel="shortcut icon" href="//ai-1303208826.cos.ap-guangzhou.myqcloud.com/WorkbenchApp/sklogo3_n.png">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
    <script type="module" src="/app/js/app.js"></script>
    <link rel="stylesheet" href="/app/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#1a1a1a',     // 极黑
                            gray: '#8e8e93',     // 银灰
                            light: '#f5f5f7',    // 浅灰背景
                            accent: '#007aff',   // 经典科技蓝
                            gold: '#d4af37',     // 奢华金（重点强调）
                        }
                    },
                    fontFamily: {
                        sans: ['"SF Pro Display"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                        serif: ['"Playfair Display"', 'Georgia', 'serif'], // 增加衬线体用于大标题，提升高级感
                    },
                    backgroundImage: {
                        'hero-pattern': "url('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80')",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light text-brand-dark font-sans antialiased overflow-hidden selection:bg-brand-accent/30">
    <div id="app" v-cloak class="h-screen w-screen flex flex-col relative overflow-hidden bg-brand-light">
        
        <!-- Navigation Header (Dynamic & Minimal) -->
        <header class="h-16 flex items-center justify-between px-5 fixed top-0 w-full z-50 transition-all duration-500" 
                :class="[state.currentView === 'home' ? (state.scrolled ? 'bg-white/80 backdrop-blur-xl border-b border-black/5' : 'bg-transparent text-white') : 'bg-transparent']">
            <div class="flex-1 flex justify-start">
                <button v-if="state.currentView !== 'home'" @click="actions.goBack" class="w-10 h-10 flex items-center justify-center -ml-2 rounded-full hover:bg-black/5 active:scale-90 transition-all">
                    <i data-lucide="arrow-left" class="w-6 h-6" :class="state.currentView === 'home' && !state.scrolled ? 'text-white' : 'text-brand-dark'"></i>
                </button>
            </div>
            
            <h1 class="text-lg font-medium tracking-wide flex-1 text-center truncate transition-opacity duration-300"
                :class="[state.currentView === 'home' && !state.scrolled ? 'opacity-0' : 'opacity-100']">
                {{ viewTitle }}
            </h1>
            
            <div class="flex-1 flex justify-end">
                <button v-if="['expenses', 'concepts'].includes(state.currentView)" @click="actions.navigate(state.currentView === 'expenses' ? 'expense-form' : 'concept-form', { mode: 'add' })" class="w-10 h-10 flex items-center justify-center -mr-2 rounded-full hover:bg-black/5 active:scale-90 transition-all">
                    <i data-lucide="plus" class="w-6 h-6 text-brand-dark"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area with View Transitions -->
        <main class="flex-1 overflow-hidden relative w-full h-full">
            <transition :name="state.transitionName">
                <component :is="currentViewComponent"></component>
            </transition>
        </main>

        <!-- Minimal FAB Action Menu -->
        <div v-show="state.currentView === 'home'" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-14 h-14 pointer-events-none">
            
            <!-- Backdrop (Invisible, just for clicking outside) -->
            <transition name="fade">
                <div v-if="state.fabOpen" @click="state.fabOpen = false" class="fixed inset-0 bg-transparent pointer-events-auto z-30"></div>
            </transition>

            <!-- Menu Items -->
            <div class="absolute inset-0 z-40 pointer-events-none">
                <transition name="slide-up-fade">
                    <div v-if="state.fabOpen" class="absolute -top-[64px] -left-[56px] pointer-events-auto">
                        <!-- Add Concept -->
                        <button @click="actions.navigate('concept-form', { mode: 'add' }); state.fabOpen = false" class="flex items-center justify-center bg-white w-[56px] h-[56px] rounded-full shadow-[0_10px_40px_rgb(0,0,0,0.12)] border border-black/5 active:scale-95 transition-all duration-300 hover:-translate-y-1 hover:bg-black hover:text-white text-brand-dark group">
                            <span class="text-[14px] font-bold group-hover:text-white">灵感</span>
                        </button>
                    </div>
                </transition>
                
                <transition name="slide-up-fade">
                    <div v-if="state.fabOpen" class="absolute -top-[64px] -right-[56px] pointer-events-auto" style="transition-delay: 50ms;">
                        <!-- Add Expense -->
                        <button @click="actions.navigate('expense-form', { mode: 'add' }); state.fabOpen = false" class="flex items-center justify-center bg-white w-[56px] h-[56px] rounded-full shadow-[0_10px_40px_rgb(0,0,0,0.12)] border border-black/5 active:scale-95 transition-all duration-300 hover:-translate-y-1 hover:bg-black hover:text-white text-brand-dark group">
                            <span class="text-[14px] font-bold group-hover:text-white">记账</span>
                        </button>
                    </div>
                </transition>
                
                <transition name="slide-up-fade">
                    <div v-if="state.fabOpen" class="absolute -top-[88px] left-1/2 -translate-x-1/2 pointer-events-auto" style="transition-delay: 100ms;">
                        <!-- AI Assistant -->
                        <button @click="actions.navigate('assistant'); state.fabOpen = false" class="flex items-center justify-center bg-white w-[56px] h-[56px] rounded-full shadow-[0_10px_40px_rgb(0,0,0,0.12)] border border-black/5 active:scale-95 transition-all duration-300 hover:-translate-y-1 hover:bg-brand-accent hover:text-white text-brand-dark group">
                            <span class="text-[14px] font-bold group-hover:text-white">AI</span>
                        </button>
                    </div>
                </transition>
            </div>

            <!-- Main FAB Button -->
            <button @click="state.fabOpen = !state.fabOpen" class="absolute inset-0 w-14 h-14 rounded-full flex items-center justify-center shadow-[0_10px_30px_rgb(0,0,0,0.15)] active:scale-90 transition-all duration-300 pointer-events-auto z-50" :class="state.fabOpen ? 'bg-white text-brand-dark rotate-[135deg]' : 'bg-brand-dark text-white'">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
        </div>
    </div>
</body>
</html>
